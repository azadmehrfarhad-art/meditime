<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیتایم | ثبت حضور بالینی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:#f5f7fb;margin:0;color:#18202a}
.card{max-width:520px;margin:28px auto;background:white;border-radius:20px;padding:22px;box-shadow:0 8px 30px #0001}
h1{margin:0 0 6px;font-size:24px}p{color:#667085}
label{display:block;margin:14px 0 6px;font-weight:bold}
input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #d0d5dd;font-size:16px}
button{margin-top:18px;border:0;background:#111827;color:white;cursor:pointer}
button:disabled{opacity:.5}
video{width:100%;border-radius:16px;background:#111;margin-top:8px}
.status{margin-top:14px;padding:12px;border-radius:12px;background:#f2f4f7;display:none}
small{color:#667085}
</style>
</head>
<body>
<div class="card">
<h1>مدیتایم</h1>
<p>سامانه ثبت حضور و غیاب بالینی دانشجویان</p>
<div id="dateTime" style="text-align:center;margin:14px 0;font-size:18px;font-weight:600;color:#344054;"></div>
  <div id="successMessage" style="
  display:none;
  text-align:center;
  background:#e8f5e9;
  color:#137333;
  padding:18px;
  border-radius:16px;
  margin:15px 0;
  font-size:18px;
  font-weight:700;
  animation:successPop .35s ease;
">
  ✓ ثبت با موفقیت انجام شد
</div> 
<form id="attendanceForm" target="submitFrame"> target="uploadFrame" method="POST">
  <iframe name="submitFrame" id="submitFrame"
  style="display:none;"></iframe> 
<input type="hidden" id="eventType" name="eventType" value="entry">
  <label>نام و نام خانوادگی</label>
  <input id="name" name="name" required>

  <label>شماره دانشجویی</label>
  <input id="studentId" name="studentId" required inputmode="numeric">
<label>بیمارستان</label>

<select id="hospital" name="hospital" required
  @keyframes successPop {
  0% {
    opacity: 0;
    transform: scale(.85);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}
style="width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #d0d5dd;font-size:16px;background:white;">

<option value="">انتخاب بیمارستان</option>
<option value="شفا">بیمارستان شفا</option>
<option value="امام">بیمارستان امام</option>

</select>

<label>بخش بالینی</label>

<select id="clinicalDepartment" name="clinicalDepartment" required
disabled
style="width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #d0d5dd;font-size:16px;background:white;">

<option value="">ابتدا بیمارستان را انتخاب کنید</option>

</select>
<label>سلفی زنده</label>

<div style="position:relative;width:100%;max-width:420px;margin:0 auto;">

  <video id="video"
         autoplay
         playsinline
         style="width:100%;display:block;border-radius:16px;background:#111;">
  </video>

  <div style="
    position:absolute;
    top:10%;
    left:22%;
    width:56%;
    height:65%;
    border:3px solid #00c853;
    border-radius:50%;
    box-sizing:border-box;
    pointer-events:none;
    z-index:10;
  "></div>

</div>

<small>سر و صورت خود را داخل کادر سبز قرار دهید.
  <input type="hidden" id="latitude" name="latitude">
  <input type="hidden" id="longitude" name="longitude">
  <input type="hidden" id="accuracy" name="accuracy">
  <input type="hidden" id="selfie" name="selfie">

 <button id="submitBtn" type="submit">ثبت ورود</button>
<button id="exitBtn" type="button">ثبت خروج</button>
</form>
<iframe name="uploadFrame" id="uploadFrame" style="display:none"></iframe>
<div class="status" id="status"></div>
</div>

<script>
/* آدرس Web App گوگل را اینجا قرار دهید */
window.API_URL = "https://script.google.com/macros/s/AKfycbxLsoRMrYf4PFqk0N-7DwCuRVhBjr4L-WrAMiuVou-IjYANaOciV7LY4ThGhcghDq7ZJw/exec";

const video = document.getElementById('video');
const form = document.getElementById('attendanceForm');
const statusBox = document.getElementById('status');
const btn = document.getElementById('submitBtn');
const exitBtn = document.getElementById('exitBtn');
exitBtn.addEventListener('click',()=>{
  document.getElementById('eventType').value='exit';
  form.requestSubmit();
});

function status(msg, show=true){
  statusBox.textContent=msg;
  statusBox.style.display=show?'block':'none';
}

async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error('مرورگر یا اتصال امن برای دوربین در دسترس نیست.');
  }
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  video.srcObject=stream;
}

function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation) return reject(new Error('GPS در دسترس نیست.'));
    navigator.geolocation.getCurrentPosition(resolve,reject,{
      enableHighAccuracy:true,timeout:15000,maximumAge:0
    });
  });
}

function captureSelfie(){
  const canvas = document.createElement('canvas');
  const width = video.videoWidth || 720;
  const height = video.videoHeight || 1280;
  const cropHeight = Math.min(height, width * 1.25);
  const cropWidth = Math.min(width, cropHeight / 1.25);
  const sx = (width - cropWidth) / 2;
  const sy = (height - cropHeight) / 2;
  canvas.width = 720;
  canvas.height = 900;
  canvas.getContext('2d').drawImage(
    video,
    sx, sy, cropWidth, cropHeight,
    0, 0, canvas.width, canvas.height
  );

  return canvas.toDataURL('image/jpeg', 0.82);
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    if(window.API_URL.includes('PASTE_YOUR')) throw new Error('ابتدا API_URL را تنظیم کنید.');
    if(!video.videoWidth) throw new Error('دوربین هنوز آماده نیست.');
    status('در حال دریافت موقعیت مکانی...');
    const pos=await getLocation();
    document.getElementById('latitude').value=pos.coords.latitude;
    document.getElementById('longitude').value=pos.coords.longitude;
    document.getElementById('accuracy').value=pos.coords.accuracy;
    document.getElementById('selfie').value=captureSelfie();

    form.action=window.API_URL;
   const currentEventType = document.getElementById('eventType').value;
btn.disabled=true;
status(currentEventType === 'exit' ? 'در حال ثبت خروج...' : 'در حال ثبت ورود...');
    form.submit();

   setTimeout(()=>{
  document.getElementById('successMessage').style.display = 'block';

  document.getElementById('successMessage').textContent =
    currentEventType === 'exit'
      ? '✓ خروج با موفقیت ثبت شد'
      : '✓ ورود با موفقیت ثبت شد';

  status('');
  btn.disabled=false;

},1800);
  }catch(err){
    status(err.message || 'خطایی رخ داد.');
    btn.disabled=false;
  }
});

startCamera().catch(err=>status(err.message || 'دسترسی دوربین برقرار نشد.'));
</script>
<script>
function updateDateTime() {
  const now = new Date();

  const date = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  }).format(now);

  const time = now.toLocaleTimeString('fa-IR', {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });

  document.getElementById('dateTime').textContent =
    date + ' | ' + time;
}

updateDateTime();
setInterval(updateDateTime, 1000);
const hospitalSelect = document.getElementById('hospital');
const departmentSelect = document.getElementById('clinicalDepartment');
const departments = {
  شفا: [
    'اورژانس کودکان',
    'ICU',
    'پست پارتوم',
    'اتاق عمل',
    'بلوک زایمان',
    'جراحی مردان',
    'جراحی زنان',
    'NICU'
  ],

  امام: [
    'CCU',
    'انکولوژی',
    'اتاق عمل',
    'ICU',
    'داخلی مردان',
    'داخلی زنان',
    'جراحی زنان',
    'دیالیز',
    'اورژانس',
    'روانپزشکی'
  ]
};

hospitalSelect.addEventListener('change', function() {
  const hospital = this.value;
  departmentSelect.innerHTML =
    '<option value="">انتخاب بخش بالینی</option>';
  if (!hospital) {
    departmentSelect.disabled = true;
    return;
  }
  departments[hospital].forEach(function(department) {
    const option = document.createElement('option');
    option.value = department;
    option.textContent = department;
    departmentSelect.appendChild(option);
  });
  departmentSelect.disabled = false;
});
</script>
</body>
</html>
